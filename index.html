<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Stopwatch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background decoration -->
    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>

    <!-- Main Application -->
    <main class="stopwatch-container">

        <div class="heading">
            <p>INTERNSHIP TASK - 02</p>
            <h1>Stopwatch</h1>
            <span>Interactive Time Tracker</span>
        </div>


        <!-- Stopwatch Card -->
        <section class="stopwatch-card">

            <div class="status">
                <span id="statusDot"></span>
                <span id="statusText">READY</span>
            </div>


            <!-- Time Display -->
            <div class="time-display" id="display">
                00:00:00
                <small>.00</small>
            </div>


            <!-- Controls -->
            <div class="controls">

                <button
                    id="startBtn"
                    class="control-btn start">
                    ▶ Start
                </button>

                <button
                    id="pauseBtn"
                    class="control-btn pause"
                    disabled>
                    ⏸ Pause
                </button>

                <button
                    id="lapBtn"
                    class="control-btn lap"
                    disabled>
                    ⏱ Lap
                </button>

                <button
                    id="resetBtn"
                    class="control-btn reset">
                    ↻ Reset
                </button>

            </div>


            <!-- Keyboard information -->
            <div class="keyboard-info">
                <span><kbd>Space</kbd> Start / Pause</span>
                <span><kbd>L</kbd> Lap</span>
                <span><kbd>R</kbd> Reset</span>
            </div>

        </section>


        <!-- Lap Section -->
        <section class="laps-section">

            <div class="laps-header">
                <h2>Lap Times</h2>

                <span id="lapCount">
                    0 Laps
                </span>
            </div>


            <div class="laps-list" id="lapsList">

                <div class="empty-laps">
                    <div class="empty-icon">⏱</div>

                    <p>No laps recorded yet</p>

                    <small>
                        Click the Lap button while the stopwatch is running.
                    </small>
                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>
                Built with
                <span>HTML</span>,
                <span>CSS</span> &
                <span>JavaScript</span>
            </p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
